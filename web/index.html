<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f6fa" />
    <title>中文电诈识别 · 数据与模型演示</title>
    <meta
      name="description"
      content="中文电信诈骗文本识别演示：在线检测一条短信或对话，查看 10 类手法判定、概率可信度、域外检验与错误分析。"
    />
  </head>
  <body>
    <div id="boot" class="boot">
      <div class="boot-inner">
        <div class="boot-mark" aria-hidden="true"></div>
        <div class="boot-text">正在加载数据与场景…</div>
      </div>
    </div>

    <header class="topbar" id="topbar">
      <a class="brand" href="#p" data-jump="p">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">中文电诈识别</span>
        <span class="brand-sub">10 类 · 演示</span>
      </a>
      <nav class="scene-nav" id="scene-nav" aria-label="场景导航"></nav>
      <div class="topbar-tools" id="topbar-tools">
        <button class="tool-btn" id="toggle-presenter" type="button" aria-pressed="false" title="讲解模式：方向键分步（Esc 退出）">
          <span class="tool-dot" aria-hidden="true"></span>讲解模式
        </button>
        <button class="tool-btn" id="toggle-motion" type="button" aria-pressed="true" title="开启动画 / 关闭后显示静态终态">
          <span class="tool-dot" aria-hidden="true"></span>动画
        </button>
        <button class="tool-btn" id="toggle-watermark" type="button" aria-pressed="true" disabled title="样例数据水印不可关闭">
          <span class="tool-dot" aria-hidden="true"></span>水印
        </button>
      </div>
    </header>

    <div class="top-progress" aria-hidden="true"><span id="top-progress-bar"></span></div>

    <main id="scenes">
      <section class="scene scene--playground" data-scene="p" id="p" aria-label="在线检测台"></section>
      <section class="scene scene--pin" data-scene="s0" data-vh="300" id="s0" aria-label="开场：一条短信被分拣"></section>
      <section class="scene scene--pin" data-scene="s1" data-vh="400" id="s1" aria-label="数据：35 万条，10 类"></section>
      <section class="scene scene--transit" data-scene="s2" id="s2" aria-label="流程：从文本到 10 个概率"></section>
      <section class="scene scene--pin" data-scene="s3" data-vh="500" id="s3" aria-label="问题一：是不是诈骗，是哪一类"></section>
      <section class="scene scene--pin" data-scene="s4" data-vh="400" id="s4" aria-label="问题二：分数可信吗"></section>
      <section class="scene scene--pin" data-scene="s5" data-vh="400" id="s5" aria-label="问题三：换个场景还管用吗"></section>
      <section class="scene scene--pin" data-scene="s6" data-vh="300" id="s6" aria-label="分拣赛：一张牌，分进 n 堆"></section>
      <section class="scene scene--transit scene--tall" data-scene="s7" id="s7" aria-label="样例复盘"></section>
      <section class="scene scene--transit scene--tall" data-scene="s8" id="s8" aria-label="错误分析"></section>
      <section class="scene scene--transit" data-scene="s9" id="s9" aria-label="结论：可用性矩阵"></section>
    </main>

    <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
    <div id="watermark" class="watermark" aria-hidden="true"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div id="presenter-hud" class="presenter-hud" hidden>
      <span id="presenter-text">检测台 · 步骤 1 / 1</span>
      <span class="presenter-keys">→ 下一步 · ← 上一步 · F 全屏 · Esc 退出</span>
    </div>

    <button id="back-top" class="back-top" type="button" aria-label="回到顶部">↑</button>

    <div id="data-banner" class="data-banner" hidden></div>

    <noscript>
      <div class="noscript">本页需要 JavaScript 才能播放场景动画。请使用最新版 Chrome 或 Edge 打开。</div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
